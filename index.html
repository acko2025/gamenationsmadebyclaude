<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="War Of Nations">
<meta name="application-name" content="War Of Nations">
<meta name="theme-color" content="#0c100e">
<meta name="description" content="A grand strategy game: lead a nation through the eras, build, research, make alliances and wage war.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png"><title>War Of Nations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a field headquarters — the map is the table; olive-slate kit panels with printed parchment
   title plates bolt onto its edges. Square, beveled, stamped. Single dark look by design. */
:root {
  color-scheme: dark;
  --ui: 1;
  --bg: #0c100e; --field: #1a201c; --field2: #222a24; --field3: #2b342d; --edge: #3d4a40; --edge-hi: rgba(226, 216, 186, .09);
  --ink: #1d1a14; --paper: #d8cba6; --paper2: #c7b88f; --fg: #e4ddc8; --muted: #93998c;
  --signal: #b8492b; --signal2: #d76a43; --gilt: #c4a457;
  --good: #8fbf7a; --bad: #e07a5c; --warn: #e2b250; --war: #b8402f; --diplo: #6f93bf; --event: #a38ad0;
  --display: 'IM Fell English SC', 'IM Fell English', Georgia, serif; --body: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --top: calc(52px * var(--ui));
  --bevel: inset 0 1px 0 var(--edge-hi), inset 0 -1px 0 rgba(0,0,0,.45), 0 0 0 1px #060807;
  --hatch: repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px);
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 500 calc(14px * var(--ui)) / 1.35 var(--body); user-select: none; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, label:focus-within { outline: 2px solid var(--gilt); outline-offset: 1px; }
#app { position: fixed; inset: 0; }
#map, #p3wrap, .p3canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#map { cursor: grab; touch-action: none; }
#map:active { cursor: grabbing; }
.p3canvas { touch-action: none; }
.ic { width: 1.35em; height: 1.35em; flex: none; }
.muted { color: var(--muted); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.num { font-family: var(--body); font-weight: 600; font-variant-numeric: tabular-nums; }
h1, h2, h3, h4, h5 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h4 { font-family: var(--body); font-weight: 700; font-size: .78em; letter-spacing: .14em; text-transform: uppercase; color: var(--paper2); margin: 16px 0 6px; display: flex; align-items: center; gap: 8px; }
h4::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--edge), transparent); }
small { color: var(--muted); font-weight: 400; }
.flag { box-shadow: 0 0 0 1px rgba(0,0,0,.7), 0 1px 2px rgba(0,0,0,.5); display: inline-block; vertical-align: middle; }
.pre { white-space: pre-line; }

/* --- controls: rectangular stamped plates --- */
.btn { background: linear-gradient(#2f3a31, #252d27); border: 0; border-radius: 0; padding: 6px 12px; box-shadow: var(--bevel); font-weight: 600; font-size: .86em; letter-spacing: .07em; text-transform: uppercase; color: var(--fg); }
.btn:hover { background: linear-gradient(#3a473c, #2c362e); }
.btn:active { box-shadow: inset 0 2px 3px rgba(0,0,0,.5), 0 0 0 1px #060807; }
.btn.primary { background: linear-gradient(var(--signal2), var(--signal)); color: #fff4e6; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
.btn.primary:hover { background: linear-gradient(#e27a52, #c45634); }
.btn.danger { background: linear-gradient(#3a2420, #2c1b18); color: #f0b5a2; }
.btn.danger:hover { background: linear-gradient(#4a2b25, #36201c); }
.btn.sm { padding: 3px 9px; font-size: .78em; }
.btn small { color: inherit; opacity: .75; font-weight: 500; letter-spacing: .02em; }
.btn.dim, .bcard.dim { opacity: .5; }
.btn.on, .chip.on { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px #8d7c52, 0 0 0 1px #060807; }
.btn.wide { width: 100%; margin-top: 10px; }
.btn[disabled] { opacity: .35; cursor: default; }
.btnrow { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.chip { background: var(--field2); border: 0; border-radius: 0; padding: 3px 9px; font-size: .84em; box-shadow: var(--bevel); text-transform: capitalize; }
.chip:hover { background: var(--field3); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.seg.dim { opacity: .45; }
.x { background: none; border: none; color: var(--muted); font-size: 1.3em; line-height: 1; padding: 0 4px; }
.x:hover { color: var(--signal2); }
.x.sm { font-size: 1em; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 22px; height: 22px; border: 0; background: var(--field3); box-shadow: var(--bevel); padding: 0; font-weight: 700; }
.stepper b { min-width: 56px; text-align: center; font-weight: 600; }

/* --- rows, cards, bars --- */
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 0; border-bottom: 1px solid rgba(61,74,64,.45); }
.row b { font-weight: 600; text-align: right; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 12px; }
.card { background: var(--field2); box-shadow: var(--bevel); padding: 8px 10px; margin: 6px 0; display: flex; flex-direction: column; gap: 3px; }
.card.war { border-left: 3px solid var(--war); }
.stats { font-size: .86em; color: var(--muted); }
.bar { display: block; height: 5px; background: #0d110f; box-shadow: inset 0 1px 1px rgba(0,0,0,.6); position: relative; overflow: hidden; margin: 3px 0; }
.bar::after { content: ''; position: absolute; inset: 0; width: var(--v); background: linear-gradient(var(--gilt), #9c7f3c); }
.bar.g::after { background: linear-gradient(#9fd08a, #6e9e5c); } .bar.y::after { background: linear-gradient(#ead27a, #b99a3e); } .bar.r::after { background: linear-gradient(#e88466, #b8492b); }
.mini { display: flex; flex-direction: column; width: 60px; }
.mini.wide { width: 100%; }
.drow { display: flex; align-items: center; gap: 8px; padding: 5px 6px; cursor: pointer; justify-content: space-between; border-left: 3px solid transparent; }
.drow > span:first-of-type { flex: 1; min-width: 0; }
.drow:hover { background: var(--field2); }
.drow.on { background: var(--field3); border-left-color: var(--signal); }
.bp { cursor: pointer; padding: 3px 0; }
.bp span { display: block; font-size: .9em; }
.bp i { display: block; height: 4px; background: #0d110f; position: relative; }
.bp i::after { content: ''; position: absolute; inset: 0; width: var(--v); background: var(--gilt); }
.tbl { width: 100%; border-collapse: collapse; font-size: .94em; }
.tbl th { text-align: left; color: var(--paper2); font-weight: 700; font-size: .78em; letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid var(--edge); padding: 4px; }
.tbl td { padding: 3px 4px; border-bottom: 1px solid rgba(61,74,64,.35); }
.tbl tr[data-act]:hover td { background: var(--field2); cursor: pointer; }
.rdot { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: middle; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
.r-food { background: #8fbf5a; } .r-wood { background: #8b6a45; } .r-stone { background: #a8a49a; } .r-iron { background: #b0705a; } .r-coal { background: #4c4c52; }
.r-steel { background: #8aa0b4; } .r-oil { background: #2a2a2a; } .r-rubber { background: #4f9a5a; } .r-aluminum { background: #c8dceb; } .r-elec { background: #f0d860; } .r-consumer { background: #c88ad0; }
.chk { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
input[type=text], input[type=number], select, textarea { background: #0f1411; border: 0; box-shadow: inset 0 1px 2px rgba(0,0,0,.6), 0 0 0 1px var(--edge); border-radius: 0; padding: 5px 7px; width: 100%; box-sizing: border-box; }
textarea { font-family: var(--mono); font-size: .82em; resize: vertical; user-select: text; }
input[type=range] { width: 100%; accent-color: var(--signal2); }
input[type=color] { width: 32px; height: 26px; padding: 0 2px; background: #0f1411; border: 0; box-shadow: 0 0 0 1px var(--edge); }

/* --- HUD --- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#topbar { position: absolute; top: 0; left: 0; right: 0; height: var(--top); display: flex; align-items: stretch; gap: 0; background: linear-gradient(#232b25, #171d19); box-shadow: inset 0 -1px 0 #0a0d0b, 0 1px 0 #3f4b41, 0 4px 14px rgba(0,0,0,.55); }
#topstats { display: flex; align-items: stretch; flex: 1; min-width: 0; overflow: hidden; }
.tcountry { display: flex; align-items: center; gap: 9px; cursor: pointer; padding: 0 14px 0 10px; min-width: 0; background: linear-gradient(90deg, rgba(0,0,0,.25), transparent); }
.tcountry b { font-family: var(--display); font-weight: 400; font-size: 1.35em; display: block; line-height: 1; white-space: nowrap; color: var(--paper); }
.tcountry small { font-size: .8em; white-space: nowrap; letter-spacing: .03em; }
.ts { display: flex; align-items: center; gap: 5px; color: var(--paper2); white-space: nowrap; padding: 0 11px; border-left: 1px solid #0b0e0c; box-shadow: inset 1px 0 0 var(--edge-hi); }
.ts .num { color: var(--fg); font-size: 1.08em; }
.ts small { font-size: .8em; font-weight: 600; }
.tres { display: flex; gap: 10px; padding: 0 12px; border-left: 1px solid #0b0e0c; box-shadow: inset 1px 0 0 var(--edge-hi); overflow: hidden; align-items: center; }
.tr { display: flex; align-items: center; gap: 3px; white-space: nowrap; font-size: .9em; }
.tr small { font-size: .78em; font-weight: 600; }
.tright { display: flex; align-items: center; gap: 10px; flex: none; padding: 0 10px; }
#date { font-family: var(--display); font-size: 1.22em; min-width: 9.5em; text-align: center; color: var(--ink); background: linear-gradient(var(--paper), var(--paper2)); padding: 4px 12px; box-shadow: inset 0 0 0 1px #8d7c52, 0 1px 0 #060807; }
#pausedTag { font-size: .74em; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--signal2); }
#speed { display: flex; gap: 0; box-shadow: 0 0 0 1px #060807; }
.sp { background: linear-gradient(#2f3a31, #232b25); border: 0; min-width: 32px; height: 28px; font-weight: 700; font-size: .82em; display: grid; place-items: center; box-shadow: inset 0 1px 0 var(--edge-hi), inset -1px 0 0 #0b0e0c; }
.sp.on { background: var(--paper); color: var(--ink); }
#leftbar { position: absolute; left: 0; top: var(--top); bottom: 0; width: calc(52px * var(--ui)); background: #121713 var(--hatch); box-shadow: inset -1px 0 0 #0a0d0b, 1px 0 0 #2f3a31; display: flex; flex-direction: column; padding: 6px 5px; gap: 4px; box-sizing: border-box; }
.lb { height: calc(40px * var(--ui)); background: linear-gradient(#273029, #1d241f); border: none; color: var(--paper2); display: grid; place-items: center; box-shadow: var(--bevel); }
.lb:hover { background: linear-gradient(#323d34, #252e27); color: var(--fg); }
.lb.on { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px #8d7c52, 0 0 0 1px #060807; }
/* panels: field-green body with a printed parchment title plate */
#panel { position: absolute; left: calc(52px * var(--ui)); top: var(--top); bottom: calc(116px * var(--ui)); width: min(calc(410px * var(--ui)), calc(100vw - 70px)); background: var(--field) var(--hatch); box-shadow: 1px 0 0 #060807, 6px 0 20px rgba(0,0,0,.45); display: flex; flex-direction: column; }
#panel header, .modal header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px 8px 14px; background: linear-gradient(var(--paper), var(--paper2)); color: var(--ink); box-shadow: inset 0 -2px 0 #8d7c52; }
#panel header h2, .modal header h2 { font-size: 1.45em; color: var(--ink); }
#panel header .x, .modal header .x { color: #5b4f35; }
.pbody { overflow-y: auto; padding: 6px 14px 18px; flex: 1; }
.ovhead { display: flex; gap: 12px; align-items: center; margin: 8px 0 6px; }
.ovhead h3 { font-size: 1.5em; color: var(--paper); }
#rightbar { position: absolute; right: 0; top: var(--top); width: min(calc(290px * var(--ui)), 40vw); bottom: calc(116px * var(--ui)); display: flex; flex-direction: column; background: linear-gradient(90deg, rgba(12,16,14,0), rgba(12,16,14,.9) 12%); padding: 8px 10px 8px 26px; box-sizing: border-box; pointer-events: none; }
#rightbar > * { pointer-events: auto; }
#mpbox { background: rgba(26,32,28,.95); box-shadow: inset 3px 0 0 var(--diplo), 0 0 0 1px #060807; padding: 6px 8px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 3px; }
.mp-h { font-size: .74em; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--paper2); }
.mp-h small { letter-spacing: .04em; text-transform: none; }
.mp-p { display: flex; align-items: center; gap: 6px; font-size: .9em; }
.mp .drow { cursor: default; }
#notefilters { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; }
#buildprog h4 { margin-top: 0; }
#notes { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 1px; }
/* war diary: date column, then the entry */
.note { display: grid; grid-template-columns: 4.6em 1fr; gap: 6px; background: rgba(26,32,28,.94); padding: 5px 8px 5px 6px; font-size: .88em; cursor: default; border-left: 3px solid var(--edge); }
.note[data-act] { cursor: pointer; }
.note[data-act]:hover { background: rgba(43,52,45,.96); }
.note small { font-size: .82em; line-height: 1.2; color: var(--paper2); opacity: .75; }
.n-war { border-left-color: var(--war); } .n-build { border-left-color: var(--gilt); } .n-diplo { border-left-color: var(--diplo); } .n-event { border-left-color: var(--event); }
#bottom { position: absolute; left: calc(52px * var(--ui)); right: 0; bottom: 0; height: calc(116px * var(--ui)); display: flex; gap: 14px; background: linear-gradient(#1f2621, #151a17) ; box-shadow: inset 0 1px 0 #3f4b41, 0 -4px 14px rgba(0,0,0,.5); padding: 8px 12px; box-sizing: border-box; }
#bottom-left { flex: 1; display: flex; gap: 18px; min-width: 0; overflow: hidden; }
.pinfo { flex: 1; min-width: 0; }
.phead { display: flex; gap: 10px; align-items: center; }
.phead h3 { font-size: 1.4em; color: var(--paper); }
.pstats { display: flex; flex-wrap: wrap; gap: 3px 14px; margin-top: 4px; font-size: .9em; }
.army { width: 290px; box-shadow: inset 1px 0 0 #0b0e0c, inset 2px 0 0 var(--edge-hi); padding-left: 14px; flex: none; }
.army h4 { margin: 0 0 2px; }
#modes { display: grid; grid-template-columns: repeat(3, auto); gap: 2px; align-content: start; flex: none; }
.mm { background: var(--field2); border: 0; box-shadow: var(--bevel); padding: 2px 8px; font-size: .78em; font-weight: 600; letter-spacing: .03em; }
.mm.on { background: var(--paper); color: var(--ink); }

/* --- panel content --- */
.qb, .bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.bcard { text-align: left; background: linear-gradient(#273029, #20271f); border: 0; box-shadow: var(--bevel); padding: 6px 8px; display: flex; flex-direction: column; gap: 1px; }
.bcard b { font-weight: 600; }
.bcard:hover { background: linear-gradient(#323d34, #262f28); }
.bcard.on { background: var(--paper); color: var(--ink); }
.bcard.on small { color: #5b4f35; }
.bcard.lock { opacity: .38; cursor: not-allowed; }
.bcard small { font-size: .8em; }
.ttree { display: flex; flex-direction: column; gap: 10px; }
.tera h5 { font-size: 1.15em; color: var(--paper); margin-bottom: 4px; }
.tcol { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.tech { text-align: left; padding: 4px 7px; border: 0; background: var(--field2); box-shadow: var(--bevel); font-size: .88em; border-left: 4px solid; }
.tech.has { background: #26331f; color: #bcd6a8; }
.tech.can { background: var(--field3); }
.tech.lock { opacity: .5; }
.tech.cur { background: var(--paper); color: var(--ink); }
.tech.q { outline: 1px dashed var(--gilt); outline-offset: -3px; }
.b-military { border-left-color: #b8402f; } .b-industry { border-left-color: #8a8a8a; } .b-infrastructure { border-left-color: #c4a457; } .b-society { border-left-color: #6f93bf; } .b-agriculture { border-left-color: #8fbf7a; } .b-medicine { border-left-color: #d084b0; } .b-government { border-left-color: #a38ad0; }
.dsel { background: var(--field2); box-shadow: var(--bevel); padding: 10px; margin: 8px 0; }
.dsel.org { border-top: 3px solid var(--signal); }
.dsel.org p { margin: 6px 0; }
.dacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.orgflags { display: flex; gap: 2px; flex: none; }
#org-inv { width: auto; max-width: 190px; }

/* --- modals --- */
#modals { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
.modal-back { position: fixed; inset: 0; background: rgba(4,6,5,.62); display: grid; place-items: center; pointer-events: auto; padding: 16px; }
.modal { background: var(--field) var(--hatch); width: min(540px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 0 0 1px #060807, 0 0 0 3px #2c362e, 0 0 0 4px #060807, 0 24px 70px rgba(0,0,0,.7); }
.modal.wide { width: min(940px, 100%); }
.modal h2 { font-size: 1.55em; }
.modal.event header { background: linear-gradient(#e2c98d, #c9ab67); }
.mbody { padding: 12px 16px; overflow-y: auto; }
.modal footer { display: flex; gap: 6px; justify-content: flex-end; padding: 10px 16px; background: rgba(0,0,0,.18); box-shadow: inset 0 1px 0 #0b0e0c; flex-wrap: wrap; }
.form { display: flex; flex-direction: column; gap: 10px; }
.form.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 14px; }
.form label, label { display: flex; flex-direction: column; gap: 4px; color: var(--paper2); font-size: .84em; font-weight: 600; letter-spacing: .04em; }
label.chk { flex-direction: row; color: var(--fg); font-weight: 500; letter-spacing: 0; }
label output { color: var(--signal2); }
.inrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.inrow label { flex-direction: row; align-items: center; }
.creator { display: flex; flex-direction: column; gap: 10px; }
.flagedit { display: flex; gap: 16px; flex-wrap: wrap; }
.fe-left { display: flex; flex-direction: column; gap: 6px; }
.fe-cv { box-shadow: 0 0 0 1px #060807, 0 3px 10px rgba(0,0,0,.5); max-width: 100%; height: auto !important; aspect-ratio: 3 / 2; touch-action: none; }
.fe-ctl { flex: 1; min-width: 270px; display: flex; flex-direction: column; gap: 8px; }
.fe-sec { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; box-shadow: inset 0 1px 0 var(--edge); }
.fe-h { font-size: .74em; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--paper2); }
.fe-upl { flex-direction: row !important; cursor: pointer; color: var(--fg) !important; }
.dd-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 10px 0; }
.slot { height: 46px; border: 1px dashed var(--edge); display: grid; place-items: center; font-size: .82em; text-align: center; padding: 2px; }
.slot.full { border: 0; border-top: 3px solid; background: var(--field2); box-shadow: var(--bevel); }
.cat-inf { border-color: #6f93bf !important; } .cat-cav { border-color: #c4a457 !important; } .cat-art { border-color: #b8492b !important; } .cat-arm { border-color: #7d8a62 !important; } .cat-sup { border-color: #a38ad0 !important; }
label.full { width: 100%; }
.tankpic { background: #0f1411; box-shadow: inset 0 0 0 1px var(--edge); margin: 10px 0; padding: 6px; display: grid; place-items: center; }
.tankpic svg { width: 260px; max-width: 100%; }
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 2px 10px; margin: 6px 0; }
.pp { flex-direction: row !important; align-items: center; gap: 6px; color: var(--fg) !important; font-weight: 500 !important; }
.pp.occ { color: var(--warn) !important; }
.scn { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 6px; }
.scard { text-align: left; background: linear-gradient(#273029, #20271f); border: 0; box-shadow: var(--bevel); padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; border-top: 3px solid var(--signal); }
.scard:hover { background: linear-gradient(#323d34, #262f28); }
.scard b { font-family: var(--display); font-weight: 400; font-size: 1.35em; color: var(--paper); }
.scard span { color: var(--muted); font-size: .92em; }
.bsides { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.bside { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.vs { font-family: var(--display); font-size: 1.5em; color: var(--signal2); }

/* --- screens --- */
#menu { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 45%, rgba(8,11,9,.2), rgba(8,11,9,.88)); padding: 16px; }
.menu-card { text-align: left; padding: 0 0 18px; background: var(--field) var(--hatch); width: min(380px, 100%); box-sizing: border-box; box-shadow: 0 0 0 1px #060807, 0 0 0 4px #2c362e, 0 0 0 5px #060807, 0 30px 80px rgba(0,0,0,.75); }
.menu-card .crest { display: none; }
.menu-card h1 { font-size: calc(46px * var(--ui)); color: var(--ink); line-height: .95; padding: 22px 24px 4px; background: linear-gradient(var(--paper), var(--paper2)); }
.menu-card .sub { font-family: var(--body); font-weight: 700; font-size: .82em; letter-spacing: .38em; text-transform: uppercase; color: #5b4f35; margin: 0 0 14px; padding: 0 24px 14px; background: linear-gradient(var(--paper2), var(--paper2)); box-shadow: inset 0 -2px 0 #8d7c52; }
.mbtns { display: flex; flex-direction: column; gap: 0; width: 100%; }
.mbtn { background: none; border: 0; text-align: left; font-family: var(--display); font-size: 1.45em; padding: 7px 24px 7px 28px; color: var(--fg); position: relative; }
.mbtn::before { content: ''; position: absolute; left: 12px; top: 50%; width: 6px; height: 6px; background: var(--edge); transform: translateY(-50%) rotate(45deg); }
.mbtn:hover:not([disabled]) { background: linear-gradient(90deg, rgba(184,73,43,.25), transparent 80%); color: #fff; }
.mbtn:hover:not([disabled])::before { background: var(--signal2); }
.mbtn[disabled] { opacity: .3; cursor: default; }
.fine { color: var(--muted); font-size: .8em; margin: 14px 24px 0; }
#pickui, #editorui { position: absolute; top: 16px; background: var(--field) var(--hatch); padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 0 0 1px #060807, 0 0 0 3px #2c362e, 0 0 0 4px #060807, 0 10px 40px rgba(0,0,0,.6); }
#pickui h2, #editorui h2 { margin: 0 -14px; padding: 10px 14px 8px; font-size: 1.5em; color: var(--ink); background: linear-gradient(var(--paper), var(--paper2)); box-shadow: inset 0 -2px 0 #8d7c52; }
#pickui { right: 16px; width: min(340px, calc(100vw - 32px)); box-sizing: border-box; }
.pickc { flex-direction: row; gap: 10px; align-items: center; }
#editorui { left: 16px; bottom: 16px; width: min(330px, calc(100vw - 32px)); overflow-y: auto; box-sizing: border-box; }
#editorui header { display: flex; justify-content: space-between; align-items: center; margin: 0 -14px; background: linear-gradient(var(--paper), var(--paper2)); padding-right: 10px; }
#editorui header h2 { box-shadow: none; background: none; margin: 0; }

/* --- province view --- */
#provui { position: absolute; top: var(--top); left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 2; }
#provui > * { pointer-events: auto; }
.ppalette { position: absolute; left: 10px; top: 10px; bottom: 54px; width: min(calc(310px * var(--ui)), 42vw); background: rgba(26,32,28,.95); box-shadow: 0 0 0 1px #060807, 0 0 0 3px #2c362e, 0 0 0 4px #060807; display: flex; flex-direction: column; }
.tabs { display: flex; flex-wrap: wrap; background: #121713; }
.tab { background: none; border: none; padding: 7px 9px; color: var(--muted); font-size: .84em; font-weight: 600; letter-spacing: .04em; }
.tab.on { color: var(--ink); background: var(--paper); }
.bgrid { padding: 8px; overflow-y: auto; flex: 1; align-content: start; }
.ptools { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; box-shadow: inset 0 1px 0 var(--edge); }
.pside { position: absolute; right: 10px; top: 10px; width: min(calc(310px * var(--ui)), 42vw); max-height: calc(100% - 70px); overflow-y: auto; background: rgba(26,32,28,.95); box-shadow: 0 0 0 1px #060807, 0 0 0 3px #2c362e, 0 0 0 4px #060807; padding: 12px; box-sizing: border-box; }
.warnbox { background: #3a2a14; box-shadow: inset 3px 0 0 var(--warn); padding: 6px 8px; color: #f0d090; }
.bsel { border-top: 3px solid var(--gilt); }
.battlebox { margin: 8px 0; padding: 8px 10px; background: linear-gradient(#3a1d17, #2a1612); box-shadow: inset 3px 0 0 var(--war), 0 0 0 1px #060807; display: flex; flex-direction: column; gap: 4px; }
.bb-h { font-family: var(--display); font-size: 1.25em; color: #f2c9b8; }
.bb-row { display: flex; gap: 8px; align-items: center; }
.garrison { margin: 8px 0; padding: 6px 10px; background: var(--field2); box-shadow: inset 3px 0 0 var(--diplo); display: flex; flex-direction: column; }
.phint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: rgba(18,23,19,.94); box-shadow: 0 0 0 1px #060807; padding: 6px 14px; color: var(--paper2); white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; font-size: .9em; letter-spacing: .02em; }
body[data-phase=province] #leftbar, body[data-phase=province] #panel, body[data-phase=province] #rightbar, body[data-phase=province] #bottom,
body[data-phase=battle] #leftbar, body[data-phase=battle] #panel, body[data-phase=battle] #rightbar, body[data-phase=battle] #bottom { display: none; }
#battleui { position: absolute; top: calc(var(--top) + 10px); left: 50%; transform: translateX(-50%); width: min(660px, calc(100vw - 32px)); z-index: 2; }
.bbar { background: rgba(26,32,28,.95); padding: 0 14px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 0 0 1px #060807, 0 0 0 3px #2c362e, 0 0 0 4px #060807; }
.bbar .bt { margin: 0 -14px; padding: 8px 14px; background: linear-gradient(#e2c98d, #c9ab67); color: var(--ink); }
.bbar .bt small { color: #5b4f35; }
.bbar h2 { font-size: 1.55em; }
.bs { display: flex; gap: 8px; align-items: center; flex: 1; }
.bs > div { flex: 1; }
.result { font-family: var(--display); font-size: 1.4em; color: var(--paper); margin: 0; }

/* --- overlays --- */
#tooltip { position: fixed; z-index: 50; max-width: 300px; background: #0c100e; box-shadow: 0 0 0 1px var(--edge), 0 6px 20px rgba(0,0,0,.6); border-top: 2px solid var(--gilt); padding: 6px 9px; pointer-events: none; font-size: .9em; }
#toasts { position: fixed; bottom: calc(128px * var(--ui)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 4px; align-items: center; z-index: 40; pointer-events: none; }
.toast { background: rgba(18,23,19,.97); box-shadow: 0 0 0 1px #060807, inset 3px 0 0 var(--gilt); padding: 7px 14px 7px 16px; transition: opacity .4s, transform .4s; max-width: 80vw; }
.toast.bad { box-shadow: 0 0 0 1px #060807, inset 3px 0 0 var(--bad); } .toast.war { box-shadow: 0 0 0 1px #060807, inset 3px 0 0 var(--war); background: rgba(48,20,16,.97); }
.toast.out { opacity: 0; transform: translateY(8px); }
#fade { position: fixed; inset: 0; background: #050706; opacity: 0; pointer-events: none; transition: opacity .38s; z-index: 45; }
#fade.on { opacity: 1; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,7,6,.78); z-index: 60; font-family: var(--display); font-size: 1.9em; color: var(--paper); }
/* phones: shrink the whole kit, and in landscape keep the map as large as possible */
@media (max-width: 760px), (max-height: 520px) {
  #menu { overflow-y: auto; }
  .menu-card h1 { font-size: 34px; }
  .mbtn { font-size: 1.25em; padding-top: 5px; padding-bottom: 5px; }
  .modal-back { padding: 6px; }
  .modal { max-height: calc(100vh - 12px); }
  .tcountry small, .tcountry b, #pausedTag { display: none; }
  .tcountry { padding: 0 8px; flex: none; }
  #topstats { overflow-x: auto; scrollbar-width: none; }
  #topstats::-webkit-scrollbar, #leftbar::-webkit-scrollbar { display: none; }
  .ts { flex: none; padding: 0 8px; }
  .tright { gap: 6px; padding: 0 6px; }
  .sp { min-width: 28px; }
  #date { min-width: 0; padding: 3px 8px; font-size: 1.05em; }
  /* the government column scrolls when the screen is too short for every button */
  #leftbar { overflow-y: auto; scrollbar-width: none; padding: 4px; gap: 3px; }
  .lb { flex: none; height: calc(36px * var(--ui)); }
  #bottom { padding: 6px 10px; gap: 10px; }
  .mm { padding: 2px 6px; }
  .ppalette { bottom: 46px; }
  .pside { max-height: calc(100% - 60px); }
}
@media (max-height: 520px) {
  .tres, #rightbar { display: none; }
  #bottom { height: auto; max-height: 38vh; overflow-y: auto; }
  #panel { bottom: 0; }
  .army { width: 240px; }
  #toasts { bottom: 12px; }
  #pickui { top: 8px; right: 8px; max-height: calc(100vh - 16px); overflow-y: auto; }
}
@media (max-width: 760px) {
  .ts { padding: 0 7px; }
  .sp { min-width: 26px; }
  .tres, #rightbar { display: none; }
  #bottom { height: auto; max-height: 45vh; flex-direction: column; overflow-y: auto; }
  #panel { bottom: 0; }
  .army { width: auto; box-shadow: none; padding: 0; }
  #modes { grid-template-columns: repeat(4, auto); }
}
@media (prefers-reduced-motion: reduce) { #fade, .toast { transition: none; } }
</style>
</head>
<body>

<div id="app">
  <canvas id="map" aria-label="World map"></canvas>
  <div id="p3wrap" hidden></div>
  <div id="hud" hidden>
    <div id="topbar"><div id="topstats"></div><div class="tright"><span id="pausedTag">Paused</span><span id="date"></span><div id="speed"></div></div></div>
    <nav id="leftbar" aria-label="Government"></nav>
    <aside id="panel" hidden></aside>
    <aside id="rightbar" aria-label="Notifications"><div id="mpbox" hidden></div><div id="notefilters"></div><div id="buildprog"></div><div id="notes"></div></aside>
    <div id="bottom"><div id="bottom-left"></div><div id="modes" aria-label="Map modes"></div></div>
  </div>
  <div id="provui" hidden></div>
  <div id="battleui" hidden></div>
  <div id="pickui" hidden></div>
  <div id="editorui" hidden></div>
  <div id="menu"></div>
  <div id="modals"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="tooltip" hidden></div>
  <div id="fade"></div>
  <div id="loading" hidden><span>Loading…</span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="data.js"></script>
<script src="world.js"></script>
<script src="worlddata.js"></script>
<script src="flags.js"></script>
<script src="histmaps.js"></script>
<script src="realmaps.js"></script>
<script src="sim.js"></script>
<script src="ai.js"></script>
<script src="commands.js"></script>
<script src="net.js"></script>
<script src="province3d.js"></script>
<script src="ui.js"></script>
<script src="ui2.js"></script>
<script src="orgs.js"></script>

<style>
/* standalone app: keep the HUD clear of the notch and home indicator */
#app { top: env(safe-area-inset-top); right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); }
html, body { overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
</style>
<script>
// iOS: stop the page itself from zooming on pinch so gestures reach the game
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
